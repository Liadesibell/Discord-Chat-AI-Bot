[project]
name = "ink-ai-discord-bot"
version = "0.1.0"
description = "Orlin Discord bot and local web control panel"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.5,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "huggingface-hub>=0.34,<2",
    "itsdangerous>=2.2,<3",
    "llama-cpp-python>=0.3.36,<0.4",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-vulkan" }

[[tool.uv.index]]
name = "llama-cpp-vulkan"
url = "https://abetlen.github.io/llama-cpp-python/whl/vulkan"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ink_ai_discord"]
